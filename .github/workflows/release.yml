name: Release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', '!*-rc.*']
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test
  publish:
    name: Publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Publishing ${GITHUB_REF_NAME}"
